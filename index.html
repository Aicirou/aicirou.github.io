<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>knullx.me | Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="knullx.me - Security | Systems | Data Engineering - An interactive terminal portfolio" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="matrix-bg" aria-hidden="true"></canvas>
  <div id="terminal">
    <pre id="output" role="log" aria-live="polite"></pre>
    <div class="input-line">
      <span class="prompt">knullx@me:~$</span>
      <input id="commandInput" autocomplete="off" spellcheck="false" autofocus aria-label="Terminal command input" />
      <span id="autocomplete"></span>
    </div>
  </div>

  <script src="terminal.js"></script>
</body>
</html>
